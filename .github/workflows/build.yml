# Construit le modèle avec FreeCAD (Linux), lance les contrôles du script et
# publie le FCStd, les STL et les STEP comme artefact téléchargeable.
name: Construire la cassette

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: freecad
          create-args: freecad=1.1.3
          init-shell: bash
          cache-environment: true
      - name: Construire et contrôler
        shell: bash -el {0}
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          FC_LIB=$(dirname "$(find "$CONDA_PREFIX" -name 'FreeCAD.so' | head -1)")
          ASSEMBLY=$(dirname "$(find "$CONDA_PREFIX" -name JointObject.py | head -1)")
          export PYTHONPATH="$FC_LIB:$ASSEMBLY:${PYTHONPATH:-}"
          python cad/build_cassette.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cassette-exports
          path: exports/
